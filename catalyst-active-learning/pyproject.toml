[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zeoal"
version = "0.1.0"
description = "Active learning for zeolite-supported multimetallic CO2-methanation catalysts (kinetic fitting, chained GP model trains, batch Bayesian optimization, EDBO interoperability)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
edbo = []  # install the Doyle-lab 'edbo' / 'edbo-plus' package manually; see README
dev = ["pytest", "nbformat", "nbconvert", "jupyter"]

[tool.setuptools]
packages = ["zeoal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
